<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>AutoJCut</title>
  <link rel="stylesheet" href="../shared/panel.css">
</head>
<body>
  <h1>AutoJCut · J-cut entre takes</h1>

  <button id="check">Ler os takes da sequência</button>
  <div class="summary" id="info"></div>

  <label class="field">Áudio antes do corte <output id="framesOut"></output>
    <input type="range" id="frames" min="1" max="30" step="1" value="4">
  </label>

  <button id="make" class="primary">Fazer J-cuts numa cópia</button>
  <button id="undo">Desfazer (apaga a cópia)</button>

  <div class="status" id="status">Takes colados com vídeo na V1 e áudio na A1. A A2 precisa estar vazia.</div>
  <p class="note">Os áudios se alternam entre A1 e A2. Os J-cuts vão numa cópia da sequência, "(J-Cut)".</p>

  <script src="../shared/host-bridge.js"></script>
  <script src="main.js"></script>
</body>
</html>
