<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>AutoJCut</title>
  <link rel="stylesheet" href="../shared/panel.css">
</head>
<body>
  <header class="wp-header">
    <div class="wp-mark">S</div>
    <div><div class="wp-title">AutoJCut</div><div class="wp-sub">J-cut entre takes</div></div>
  </header>

  <section class="card">
    <h2>Takes</h2>
    <div class="summary" id="info" style="margin-top:0">—</div>
    <button id="check" class="ghost">Ler os takes da sequência</button>
  </section>

  <section class="card">
    <label class="field">Áudio antes do corte <output id="framesOut"></output>
      <input type="range" id="frames" min="1" max="30" step="1" value="4">
    </label>
    <label class="check"><input type="checkbox" id="backup"> Fazer backup antes (guarda uma cópia da sequência)</label>
  </section>

  <button id="make" class="primary">Fazer J-cuts</button>
  <button id="undo" class="ghost">Voltar ao backup</button>

  <div class="status" id="status">Takes colados com vídeo na V1 e áudio na A1. A A2 precisa estar vazia.</div>
  <p class="note">Os J-cuts vão na sequência aberta, com os áudios alternando entre A1 e A2. Com backup, uma cópia "(backup J-Cut)" fica guardada; sem backup, desfaça com Ctrl+Z.</p>

  <script src="../shared/host-bridge.js"></script>
  <script src="main.js"></script>
</body>
</html>
