<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>AutoSoundFX</title>
  <link rel="stylesheet" href="../shared/panel.css">
</head>
<body>
  <h1>AutoSoundFX · som por cor de marcador</h1>

  <button id="refresh">Ler marcadores da sequência</button>
  <div id="rows" class="sfx-rows"></div>

  <button id="apply" class="primary">Aplicar SFX</button>
  <button id="remove">Remover SFX inseridos</button>

  <div class="status" id="status">Marque a sequência com cores e escolha um som para cada cor.</div>
  <p class="note">Se a faixa escolhida estiver ocupada no ponto do marcador, o som vai para a próxima faixa livre acima.</p>

  <script src="../shared/host-bridge.js"></script>
  <script src="main.js"></script>
</body>
</html>
